<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Izrah Vendiola</title>
  <defs><clipPath id="v"><rect x="15.5" y="22" width="33" height="27" rx="9"/></clipPath></defs>
  <rect width="64" height="64" rx="14" fill="#121212"/>
  <!-- background circuit traces -->
  <g fill="none" stroke="#4C1D75" stroke-width="1.5" stroke-linejoin="round">
    <path d="M2 14 H9 L13 10 H21"/><path d="M62 14 H55 L51 10 H43"/>
    <path d="M2 52 H7 L11 56 H15"/><path d="M62 52 H57 L53 56 H49"/>
  </g>
  <g fill="#6B21A8"><circle cx="21" cy="10" r="1.6"/><circle cx="43" cy="10" r="1.6"/><circle cx="15" cy="56" r="1.6"/><circle cx="49" cy="56" r="1.6"/></g>
  <!-- antenna -->
  <rect x="30.75" y="9" width="2.5" height="9" fill="#C08BEA"/>
  <circle cx="32" cy="8.5" r="4" fill="#F4C66A"/>
  <!-- code-bracket ears -->
  <g fill="none" stroke="#C08BEA" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="8.5,30 4,36 8.5,42"/><polyline points="55.5,30 60,36 55.5,42"/>
  </g>
  <!-- feet pins -->
  <g fill="#5B1B32"><rect x="19" y="53" width="5" height="7"/><rect x="29.5" y="53" width="5" height="7"/><rect x="40" y="53" width="5" height="7"/></g>
  <!-- head -->
  <rect x="11" y="17" width="42" height="38" rx="12" fill="#6B21A8"/>
  <!-- visor with scanlines -->
  <rect x="15.5" y="22" width="33" height="27" rx="9" fill="#121212"/>
  <g clip-path="url(#v)" stroke="#3B1660" stroke-width="1"><path d="M15 26.5H49M15 31.5H49M15 36.5H49M15 41.5H49M15 46.5H49"/></g>
  <!-- eyes: I and V -->
  <rect x="20" y="27" width="5.5" height="13" rx="2.75" fill="#E9DEF2"/>
  <polyline points="30.5,28.5 36,38.5 41.5,28.5" fill="none" stroke="#F4C66A" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- terminal-cursor mouth -->
  <rect x="26" y="43.5" width="8" height="3" fill="#E9DEF2"/>
  <rect x="36" y="43.5" width="3" height="3" fill="#F4C66A"/>
</svg>
