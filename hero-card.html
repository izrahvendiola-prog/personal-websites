<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Profile Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">

<!-- Lets the CSS hide elements only when JS is available (so nothing stays hidden without JS) -->
<script>document.documentElement.classList.add('js');</script>

<style>
  /* ========= Demo page (delete this block when you paste into your site) ========= */
  :root { --bg:#0d0d10; --gold:#f2c14e; --violet-1:#be68ff; --violet-2:#541caa; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(255,255,255,.12) 1.2px, transparent 1.2px);
    background-size: 40px 40px;
  }

  /* ========= Hero profile card ========= */
  .hero-card {
    --w: clamp(260px, 30vw, 360px);          /* card width: scales with the screen */
    --off: calc(var(--w) * 0.05);            /* gold frame offset */
    --radius: 50% 50% 26px 26px / 36.2% 36.2% 26px 26px;   /* arch shape */
    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    position: relative;
    width: var(--w);
    aspect-ratio: 680 / 940;
    margin: 8vh calc(var(--off) + 4vw) calc(var(--off) + 4vh) 4vw;
  }

  /* gold outline frame behind the card */
  .hero-card .frame {
    position: absolute; inset: 0;
    border: 2px solid var(--gold);
    border-radius: var(--radius);
    translate: var(--off) var(--off);          /* offset down-right; uses 'translate' so the fade-in can't cancel it */
    transition: translate .5s var(--ease);
  }
  .hero-card:hover .frame { translate: calc(var(--off) * 1.3) calc(var(--off) * 1.3); }

  /* gradient arch panel */
  .hero-card .panel {
    position: absolute; inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 33%, rgba(255, 215, 255, .30), transparent 46%),
      linear-gradient(155deg, var(--violet-1) 0%, var(--violet-2) 100%);
  }

  /* SVG layers: one behind the photo, one in front */
  .hero-card .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-card .layer-front {
    z-index: 3; pointer-events: none;
    border-radius: var(--radius); overflow: hidden;
  }

  /* photo: rises from the bottom edge; head pokes above the arch */
  .hero-card .photo-wrap {
    position: absolute; z-index: 2;
    left: 0; right: 0; bottom: 0; top: -15%;
    overflow: hidden;                          /* clips the photo at the card's bottom edge */
    pointer-events: none;
  }
  .hero-card .photo-lift {
    position: absolute; inset: 0;
    transition: transform .5s var(--ease);
  }
  .hero-card:hover .photo-lift { transform: translateY(-8px); }

  .hero-card .photo {
    position: absolute; bottom: 0; left: 50%;
    height: 95.3%; width: auto; max-width: none;
    transform: translateX(-50%);
    filter: drop-shadow(0 8px 14px rgba(30, 5, 70, .45));
    -webkit-mask-image: linear-gradient(to top, transparent 0, #000 7%);
            mask-image: linear-gradient(to top, transparent 0, #000 7%);
  }

  /* SVG text + pen-tool styling */
  .hero-card .mono { font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
  .hero-card .bezier { stroke-dasharray: 1; stroke-dashoffset: 1; }

  /* ========= Animations ========= */
  /* hidden start state, only when JS is running */
  .js .hero-card .frame,
  .js .hero-card .panel,
  .js .hero-card .layer-front,
  .js .hero-card .photo { opacity: 0; }
  .js .hero-card .pen-extras { opacity: 0; }

  @keyframes fade-in   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes card-in   { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes photo-rise {
    from { opacity: 0; transform: translateX(-50%) translateY(60px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes draw  { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes blink { 0%, 55% { opacity: 1; } 70%, 100% { opacity: .15; } }

  .hero-card.in .frame        { animation: fade-in .7s .00s ease both; }
  .hero-card.in .panel        { animation: card-in .7s .12s var(--ease) both; }
  .hero-card.in .layer-front  { animation: fade-in .6s .35s ease both; }
  .hero-card.in .photo        { animation: photo-rise .9s .45s var(--ease) both; }  /* main moment */
  .hero-card.in .bezier       { animation: draw 1.1s 1.3s ease-in-out both; }
  .hero-card.in .pen-extras   { animation: fade-in .5s 1.5s ease both; }
  .hero-card.in .rec-dot      { animation: blink 1.4s 1.5s ease-in-out infinite; }

  /* ========= Small screens ========= */
  @media (max-width: 480px) {
    .hero-card .readout { display: none; }
  }

  /* ========= Reduced motion: show the final state, no movement ========= */
  @media (prefers-reduced-motion: reduce) {
    .hero-card *, .hero-card *::before { animation: none !important; transition: none !important; }
    .js .hero-card .frame, .js .hero-card .panel, .js .hero-card .layer-front,
    .js .hero-card .photo, .js .hero-card .pen-extras { opacity: 1 !important; }
    .hero-card .bezier { stroke-dashoffset: 0 !important; }
  }
</style>
</head>

<body>

<!-- ========= Hero profile card ========= -->
<div class="hero-card" id="heroCard">
  <div class="frame"></div>

  <div class="panel">
    <!-- BEHIND the photo: dots, thirds grid, aperture, pen-tool curve -->
    <svg class="layer" viewBox="0 0 680 940" aria-hidden="true">
      <defs>
        <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
          <circle cx="18" cy="18" r="1.7" fill="#fff" fill-opacity=".18"/>
        </pattern>
        <!-- one aperture blade, rotated 6 times below -->
        <path id="blade" d="M120.7 32.3 L-13.9 265.6 M120.7 32.3 L32.3 120.7"/>
      </defs>

      <rect width="680" height="940" fill="url(#dots)"/>

      <!-- rule-of-thirds grid -->
      <g stroke="#fff" stroke-opacity=".16" stroke-width="2">
        <line x1="226.7" y1="0" x2="226.7" y2="940"/><line x1="453.3" y1="0" x2="453.3" y2="940"/>
        <line x1="0" y1="313.3" x2="680" y2="313.3"/><line x1="0" y1="626.7" x2="680" y2="626.7"/>
      </g>

      <!-- camera aperture -->
      <g transform="translate(340 390)" fill="none" stroke="#fff" stroke-linecap="round">
        <circle r="300" stroke-opacity=".28" stroke-width="3"/>
        <circle r="266" stroke-opacity=".16" stroke-width="2"/>
        <g stroke-opacity=".28" stroke-width="3">
          <use href="#blade"/>
          <use href="#blade" transform="rotate(60)"/>
          <use href="#blade" transform="rotate(120)"/>
          <use href="#blade" transform="rotate(180)"/>
          <use href="#blade" transform="rotate(240)"/>
          <use href="#blade" transform="rotate(300)"/>
        </g>
      </g>

      <!-- pen-tool bezier curve (draws itself) -->
      <path class="bezier" pathLength="1" d="M30 900 C142 830 18 730 42 650"
            fill="none" stroke="#f2c14e" stroke-width="5" stroke-linecap="round"/>
      <g class="pen-extras">
        <g stroke="#fff" stroke-opacity=".7" stroke-width="2">
          <line x1="30" y1="900" x2="142" y2="830"/><line x1="42" y1="650" x2="18" y2="730"/>
        </g>
        <g fill="#fff" stroke="#f2c14e" stroke-width="3">
          <circle cx="142" cy="830" r="6"/><circle cx="18" cy="730" r="6"/>
          <rect x="22" y="892" width="16" height="16"/><rect x="34" y="642" width="16" height="16"/>
        </g>
      </g>
    </svg>
  </div>

  <!-- the photo (transparent PNG): swap the src with your own cutout -->
  <div class="photo-wrap">
    <div class="photo-lift">
      <img class="photo" src="assets/images/profile-cutout.webp" alt="Portrait photo of Izrah Vendiola">
    </div>
  </div>

  <!-- IN FRONT of the photo: viewfinder, REC, RAW, camera readout -->
  <div class="layer layer-front">
    <svg class="layer" viewBox="0 0 680 940" aria-hidden="true">
      <!-- viewfinder corner brackets -->
      <path d="M70 221 V175 H116 M564 175 H610 V221 M70 859 V905 H116 M610 859 V905 H564"
            fill="none" stroke="#eef2ff" stroke-width="4"/>

      <!-- REC -->
      <circle class="rec-dot" cx="98" cy="202" r="7" fill="#ff4646"/>
      <text class="mono" x="114" y="209" font-size="20" fill="#eef2ff">REC</text>

      <!-- RAW badge -->
      <rect x="486" y="188" width="100" height="36" rx="18" fill="#f2c14e"/>
      <text class="mono" x="536" y="213" font-size="20" fill="#14102a" text-anchor="middle">RAW</text>

      <!-- camera readout -->
      <g class="readout">
        <text class="mono" x="90" y="868" font-size="21" fill="#eef2ff">f/1.8   1/250   ISO 100</text>
        <g fill="none" stroke="#eef2ff" stroke-width="3">
          <rect x="500" y="852" width="40" height="20"/>
        </g>
        <rect x="504" y="856" width="26" height="12" fill="#eef2ff"/>
        <rect x="543" y="858" width="4" height="8" fill="#eef2ff"/>
      </g>
    </svg>
  </div>
</div>

<script>
  /* Play the animation once, when the card scrolls into view */
  (function () {
    var card = document.getElementById('heroCard');
    if (!('IntersectionObserver' in window)) { card.classList.add('in'); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { card.classList.add('in'); io.disconnect(); }
      });
    }, { threshold: 0.3 });
    io.observe(card);
  })();
</script>

</body>
</html>
